[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colca-data-contracts"
# Release builds take the version from the git tag.
version = "0.0.0"
description = "Payload contracts, topic helpers and golden vectors for Colca"
readme = "README.md"
license = { text = "FSL-1.1-ALv2" }
requires-python = ">=3.11"
authors = [
    { name = "Colca contributors" }
]
dependencies = [
    # franzmq 0.5 moved the publishing node to topic level 4 and 0.6 aligned
    # authentication and acknowledgement with the broker. The package supports
    # the whole range, so a service can move its own pin when it is ready.
    "franzmq>=0.4.1,<0.7",
    "python-decouple>=3.8",
    # derive_annotation_id ULID-encodes a content hash.
    "ulid-py>=1.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10",
    "pyyaml>=6.0",
    "paho-mqtt>=2.1,<3",
]

[project.urls]
Source = "https://github.com/alpamayo-solutions/colca"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
colca_data_contracts = [
    "semantic_tags/*.yaml",
    "metadata_types/*.yaml",
    "annotation_types/*.yaml",
    "vectors/*.json",
    "data_models/*.yaml",
]

# Projects that install this package from a path, such as a chaski checkout
# next to this one, would otherwise only see a changed payload or data model
# after reinstalling by hand: uv rebuilds a path dependency only when its cache
# keys change, and the default key is pyproject.toml alone.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.yaml" },
    { file = "src/**/*.json" },
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
ignore = ["E402", "E501", "F403"]
