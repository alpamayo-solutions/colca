[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colca-data-contracts"
version = "0.1.0"
description = "Colca domain-specific data contracts extending franzmq"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Colca contributors" }
]
dependencies = [
    "franzmq==0.4.1",
    "python-decouple>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
colca_data_contracts = ["interfaces/*.yaml"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
ignore = ["E402", "E501", "F403"]
