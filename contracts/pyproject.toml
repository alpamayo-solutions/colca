[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colca-data-contracts"
version = "0.1.0"
description = "Colca domain-specific data contracts extending franzmq"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Colca contributors" }
]
dependencies = [
    # Transition window (schema-bundle design §9.2/§12a): 0.5.0 moved the
    # publisher's identity to topic level 4 and 0.6.x aligned authentication and
    # acknowledgement with the broker. Services cut over one at a time and their
    # own franzmq pin is the switch, so an exact pin here would make that switch
    # global — every service depending on this package by path resolves against
    # it. The range spans the migration (the connector is already on 0.6.x, the
    # rest still on 0.4.1) and closes to an exact pin when the last consumer has
    # moved; until then scripts/check-dependency-boundary.py is what keeps
    # the skew readable.
    "franzmq>=0.4.1,<0.7",
    "python-decouple>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
colca_data_contracts = [
    "semantic_tags/*.yaml",
    "metadata_types/*.yaml",
    "annotation_types/*.yaml",
    "vectors/*.json",
    "data_models/*.yaml",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
ignore = ["E402", "E501", "F403"]
