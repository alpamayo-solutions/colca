[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colca-data-contracts"
# Release builds take the version from the git tag.
version = "0.0.0"
description = "Payload contracts, topic helpers and golden vectors for Colca"
readme = "README.md"
license = { text = "FSL-1.1-ALv2" }
requires-python = ">=3.11"
authors = [
    { name = "Colca contributors" }
]
dependencies = [
    # franzmq 0.5 moved the publishing node to topic level 4 and 0.6 aligned
    # authentication and acknowledgement with the broker. The package supports
    # the whole range, so a service can move its own pin when it is ready.
    "franzmq>=0.4.1,<0.7",
    "python-decouple>=3.8",
    # derive_annotation_id ULID-encodes a content hash.
    "ulid-py>=1.1",
]

[project.optional-dependencies]
test = [
    "jsonschema>=4.26,<5",
    "pytest>=8.4,<10",
    "pyyaml>=6.0",
    "paho-mqtt>=2.1,<3",
]

[project.urls]
Source = "https://github.com/alpamayo-solutions/colca"

[dependency-groups]
lint = [
    "ruff==0.16.8",
    "bandit==1.9.4",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
colca_data_contracts = [
    "py.typed",
    "semantic_tags/*.yaml",
    "metadata_types/*.yaml",
    "annotation_types/*.yaml",
    "vectors/*.json",
    "data_models/*.yaml",
]

# Projects that install this package from a path, such as a chaski checkout
# next to this one, would otherwise only see a changed payload or data model
# after reinstalling by hand: uv rebuilds a path dependency only when its cache
# keys change, and the default key is pyproject.toml alone.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.yaml" },
    { file = "src/**/*.json" },
]

[tool.ruff]
target-version = "py311"
line-length = 120
# The examples in Markdown are laid out by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "C4", "PIE", "RUF"]
# Line length is the formatter's job.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The franzmq Topic patch has to run before the payload modules are imported.
"src/colca_data_contracts/__init__.py" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# These publish no type information.
module = ["franzmq", "franzmq.*", "decouple"]
ignore_missing_imports = true
