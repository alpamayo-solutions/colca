[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colca-data-contracts"
version = "0.1.0"
description = "Colca domain-specific data contracts extending franzmq"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Colca contributors" }
]
dependencies = [
    # Transition window (schema-bundle design §9.2/§12a): franzmq 0.5.0 moved the
    # publisher's identity to topic level 4, and services cut over to the
    # embedded broker one at a time — their own franzmq pin is the switch. An
    # exact pin here would make that switch global, because every service that
    # depends on this package by path resolves against it. The range closes to
    # ==0.5.0 when the last consumer has moved; until then the boundary
    # check (scripts/check_dependency_boundary.py) is what keeps the skew
    # readable.
    "franzmq>=0.4.1,<0.6",
    "python-decouple>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
colca_data_contracts = ["interfaces/*.yaml", "vectors/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
ignore = ["E402", "E501", "F403"]
