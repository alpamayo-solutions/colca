# colca/deploy/docker-compose.yml — the 4-node / 3-level demo topology.
#
#   global (level 1)            mounts: site1 → n-site1
#      ▲ mTLS
#   site1  (level 2)            mounts: edge1 → n-edge1, edge2 → n-edge2
#      ▲          ▲ mTLS
#   edge1        edge2          machines m1/m2 enrolled at their edges (smoke.sh)
#      ▲ MQTT       ▲ MQTT
#     m1           m2
#
# Startup is deterministic without healthchecks (distroless has no shell, so a
# CMD-based healthcheck is impossible): depends_on gives the parent-before-child
# order, and `restart: unless-stopped` heals a node that loses the race anyway —
# while still honouring an explicit `docker compose stop <svc>` (which the smoke
# test uses for the offline catch-up assertion).
#
# COLCA_IMAGE selects the image for every container (default colca:dev, the tag
# `make docker` builds): the level-4 system suite (tests/system) drives this
# same file against whatever image dev.py resolved (bake tag or CI run tag).
#
# Per-LINK networks — one Docker network per tree edge, nothing shared wider:
#
#   link3-hub    global ↔ site1
#   link2-edges  site1  ↔ edge1, edge2
#   link1-m1     edge1  ↔ m1
#   link1-m2     edge2  ↔ m2
#
# This is what lets the chaos suite partition a SINGLE link (`docker network
# disconnect` of the child's endpoint from its uplink network) while every
# other link — including the machine feeding the partitioned edge — keeps
# flowing.
#
# Host ports — every published port is templated as ${COLCA_PORT_*:-<base>}:
# unset (plain `docker compose up`, demo.sh, smoke.sh) gives today's fixed
# base ports; the system-suite harness (tests/system/system_world.py, via
# `dev.py test system --port-offset N`) computes the full variable set from
# ONE offset (base+N each) and derives the compose project name from the same
# offset (`deploy` at 0, `deploy-oN` otherwise), so concurrent worlds are
# disjoint in ports AND containers/networks/volumes by construction. Compose
# has no arithmetic in ${...} interpolation, so per-port variables computed
# by the harness are the mechanism; the defaults keep this file standalone.
# COLCA_PORT_OFFSET/COLCA_PORT_* are the same repo-wide port-offset
# convention node-manager uses (`colca generate --port-offset`) — see the
# authoritative offset table in the "Port Offset Rules" section.
# Per-purpose offset conventions are documented in
# docs/source/development/testing.rst (0 dev/demo/smoke, 400 chaos in CI,
# 500 system in CI).
#
# Load-bearing detail — host observability under partition: Docker binds a
# container's published-port forwarding to ONE endpoint (measured on Docker
# Desktop 29: the network attached at container create — compose picks it by
# `priority`, then name; `gw_priority` does NOT move the forwarding). So a
# node that can be partitioned must never lose that endpoint: each one gets
# a dedicated single-member OBSERVATION network (`host-<node>`) that wins
# the primary pick under both rules — `priority: 100` and sorting before
# every `link*` name — and that no chaos primitive ever disconnects. The
# host can therefore always observe a partitioned node over HTTP/MQTT; the
# chaos self-tests assert reachability DURING a partition and go red if a
# Docker version changes the selection rule. Single-member networks carry no
# node↔node connectivity, so they cannot leak around a severed link.
services:
  global:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/global.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/global.yaml:/etc/colca/global.yaml:ro"
      - "./keys:/keys:ro"
      - "global-data:/data"
    # 11880 is the hub bus: every record replicated up from the whole tree is
    # mirrored there under its stored topic (subscribe with an enrolled read:# identity).
    # 11890/11891 are the HUMAN doors (JWT over TLS: raw MQTT / WebSocket) —
    # usable only when the human-auth profile (keycloak) is up; without it the
    # hub keeps retrying its JWKS fetch and the doors reject every token.
    ports:
      - "127.0.0.1:${COLCA_PORT_GLOBAL_API:-18080}:443"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_MQTT:-11880}:8883"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_HUMAN_MQTT:-11890}:8884"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_HUMAN_WS:-11891}:8885"
    networks:
      link3-hub:     # keep upstream's primary pick: host ports bind here
        priority: 100
      svc-global: {}  # global ↔ notifications sidecar only
      kc-global: {}  # global ↔ keycloak only (JWKS fetch), pairwise by design
      gs-global: {}  # global ↔ grantsync only, pairwise for the same reason

  site1:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/site1.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/site1.yaml:/etc/colca/site1.yaml:ro"
      - "./keys:/keys:ro"
      - "site1-data:/data"
    ports:
      - "127.0.0.1:${COLCA_PORT_SITE1_API:-18081}:443"
      - "127.0.0.1:${COLCA_PORT_SITE1_MQTT:-11881}:8883"
    depends_on: [global]
    networks:
      host-site1:    # observation net = primary: host ports survive partitions
        priority: 100
      link2-edges: {}
      link3-hub: {}
      svc-site1: {}

  edge1:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/edge1.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/edge1.yaml:/etc/colca/edge1.yaml:ro"
      - "./keys:/keys:ro"
      - "edge1-data:/data"
    ports:
      - "127.0.0.1:${COLCA_PORT_EDGE1_API:-18082}:443"
      - "127.0.0.1:${COLCA_PORT_EDGE1_MQTT:-11883}:8883"
    depends_on: [site1]
    networks:
      host-edge1:    # observation net = primary: host ports survive partitions
        priority: 100
      kc-edge1: {}   # edge1 ↔ keycloak only (JWKS fetch), pairwise by design
      link1-m1: {}
      link2-edges: {}
      svc-edge1: {}

  edge2:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/edge2.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/edge2.yaml:/etc/colca/edge2.yaml:ro"
      - "./keys:/keys:ro"
      - "edge2-data:/data"
    ports:
      - "127.0.0.1:${COLCA_PORT_EDGE2_API:-18083}:443"
      - "127.0.0.1:${COLCA_PORT_EDGE2_MQTT:-11884}:8883"
    depends_on: [site1]
    networks:
      host-edge2:    # observation net = primary: host ports survive partitions
        priority: 100
      link1-m2: {}
      link2-edges: {}
      svc-edge2: {}

  global-notifications:
    image: ${NOTIFICATIONS_IMAGE:-notifications:dev}
    restart: unless-stopped
    depends_on: [global]
    environment:
      COLCA_URL: http://global
      STATE_PATH: /var/lib/notifications/state.db
      HTTP_ADDR: :8080
      POLL_INTERVAL: 100ms
    volumes:
      - global-notifications-data:/var/lib/notifications
    healthcheck:
      test: ["CMD", "/usr/local/bin/notifications", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [svc-global]

  site1-notifications:
    image: ${NOTIFICATIONS_IMAGE:-notifications:dev}
    restart: unless-stopped
    depends_on: [site1]
    environment:
      COLCA_URL: http://site1
      STATE_PATH: /var/lib/notifications/state.db
      HTTP_ADDR: :8080
      POLL_INTERVAL: 100ms
    volumes:
      - site1-notifications-data:/var/lib/notifications
    healthcheck:
      test: ["CMD", "/usr/local/bin/notifications", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [svc-site1]

  edge1-notifications:
    image: ${NOTIFICATIONS_IMAGE:-notifications:dev}
    restart: unless-stopped
    depends_on: [edge1]
    environment:
      COLCA_URL: http://edge1
      STATE_PATH: /var/lib/notifications/state.db
      HTTP_ADDR: :8080
      POLL_INTERVAL: 100ms
    volumes:
      - edge1-notifications-data:/var/lib/notifications
    healthcheck:
      test: ["CMD", "/usr/local/bin/notifications", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [svc-edge1]

  edge2-notifications:
    image: ${NOTIFICATIONS_IMAGE:-notifications:dev}
    restart: unless-stopped
    depends_on: [edge2]
    environment:
      COLCA_URL: http://edge2
      STATE_PATH: /var/lib/notifications/state.db
      HTTP_ADDR: :8080
      POLL_INTERVAL: 100ms
    volumes:
      - edge2-notifications-data:/var/lib/notifications
    healthcheck:
      test: ["CMD", "/usr/local/bin/notifications", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [svc-edge2]

  m1:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-machine"]
    restart: unless-stopped
    environment:
      MACHINE_ULID: m1
      MACHINE_KEY: /keys/m1-machine.key
      BROKER_ADDR: "edge1:8883"
      NODE_ULID: n-edge1
      PUBLISH_INTERVAL_MS: "1000"
      # colca-machine simulator-only clock skew (time-sync design §4,
      # cmd/colca-machine/main.go's SIM_CLOCK_OFFSET_MS) -- a per-machine
      # var so the chaos suite (tests/system/system_world.py's
      # skew_machine()) can `docker compose up -d --force-recreate m1` with
      # SIM_CLOCK_OFFSET_MS_M1 set in its env to skew just this machine's
      # notion of wall time; unset (or 0) matches today's behaviour exactly.
      SIM_CLOCK_OFFSET_MS: "${SIM_CLOCK_OFFSET_MS_M1:-0}"
    volumes:
      - "./keys:/keys:ro"
    depends_on: [edge1]
    networks: [link1-m1]

  m2:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-machine"]
    restart: unless-stopped
    environment:
      MACHINE_ULID: m2
      MACHINE_KEY: /keys/m2-machine.key
      BROKER_ADDR: "edge2:8883"
      NODE_ULID: n-edge2
      PUBLISH_INTERVAL_MS: "1000"
      # See m1's SIM_CLOCK_OFFSET_MS comment above.
      SIM_CLOCK_OFFSET_MS: "${SIM_CLOCK_OFFSET_MS_M2:-0}"
    volumes:
      - "./keys:/keys:ro"
    depends_on: [edge2]
    networks: [link1-m2]

  # Real Keycloak for the human-auth world (level-4 suite; opt-in for demos):
  # upstream image in dev mode importing the minimal colca realm. The exact
  # upstream base the Colca standard image builds on (quay 26.6.3) — the
  # full standard image needs Postgres + the Colca realm template and is
  # deliberately NOT dragged into the colca deploy.
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    profiles: ["human-auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-demo-password
      # Pin the issuer: tokens minted through the host port (127.0.0.1:18095)
      # must carry the SAME iss the nodes validate against (the in-network
      # name), or every token dies on the issuer check.
      KC_HOSTNAME: http://keycloak:8080
    volumes:
      - "./config/colca-realm.json:/opt/keycloak/data/import/colca-realm.json:ro"
    ports:
      - "127.0.0.1:${COLCA_PORT_KEYCLOAK:-18095}:8080"
    # Pairwise kc-* networks: each auth-bearing node (an `auth:` block in its
    # config template — global and edge1 today) reaches keycloak for its JWKS
    # fetch over its OWN two-member network. No kc-* network ever carries
    # node↔node traffic, so the chaos suite's "nothing leaks around a severed
    # link" invariant holds, and no chaos primitive disconnects kc-* — token
    # verification keeps working during partitions, like HEAD's flat network.
    networks: [kc-edge1, kc-global, gs-keycloak]

  # The grant-sync service: Keycloak's grants become _Group definitions in the
  # tree, and the tree's elements become authz resources somebody can grant on.
  # A SIBLING of colcad from the same image, never part of it — Keycloak stays
  # out of the node core and out of the message path.
  #
  # It talks to the ROOT node only. Definitions descend on their own, so there is
  # nothing to run per node, and an edge that is offline picks them up when it
  # reconnects.
  #
  # Its OWN profile, not human-auth, and the reason is worth stating: this
  # service CONVERGES. Any _Group definition authored at the root that Keycloak
  # does not account for is one it retracts — which is correct in production and
  # ruinous in a test world where other suites author group definitions by hand.
  # So it starts only when a test (or an operator) asks for it by name:
  #   docker compose --profile human-auth --profile grant-sync up -d
  grantsync:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-grantsync"]
    profiles: ["grant-sync"]
    restart: unless-stopped
    environment:
      COLCA_URL: http://global
      COLCA_SERVICE: grantsync
      KC_URL: http://keycloak:8080
      KC_REALM: colca
      KC_CLIENT_SECRET: colca-authz-dev-secret
      OWNER: colca-demo
      SYNC_INTERVAL_MS: "${GRANTSYNC_INTERVAL_MS:-5000}"
    ports:
      - "127.0.0.1:${COLCA_PORT_GRANTSYNC:-19090}:9090"
    depends_on: [global, keycloak]
    # Its own pairwise networks, keeping the kc-* invariant intact: no network
    # this service joins ever carries node↔node traffic either.
    networks: [gs-global, gs-keycloak]

volumes:
  global-data: {}
  site1-data: {}
  edge1-data: {}
  edge2-data: {}
  global-notifications-data: {}
  site1-notifications-data: {}
  edge1-notifications-data: {}
  edge2-notifications-data: {}

networks:
  host-edge1: {}
  host-edge2: {}
  host-site1: {}
  gs-global: {}
  gs-keycloak: {}
  kc-edge1: {}
  kc-global: {}
  link1-m1: {}
  link1-m2: {}
  link2-edges: {}
  link3-hub: {}
  svc-global: {}
  svc-site1: {}
  svc-edge1: {}
  svc-edge2: {}
