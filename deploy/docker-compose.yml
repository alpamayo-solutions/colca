# The demo topology: four nodes on three levels, two simulated machines.
#
#   global (level 1)            mounts: site1 → n-site1
#      ▲ mTLS
#   site1  (level 2)            mounts: edge1 → n-edge1, edge2 → n-edge2
#      ▲          ▲ mTLS
#   edge1        edge2          machines m1/m2 enrolled at their edges (smoke.sh)
#      ▲ MQTT       ▲ MQTT
#     m1           m2
#
# Startup is deterministic without healthchecks (distroless has no shell, so a
# CMD-based healthcheck is impossible): depends_on gives the parent-before-child
# order, and `restart: unless-stopped` heals a node that loses the race anyway —
# while still honouring an explicit `docker compose stop <svc>` (which the smoke
# test uses for the offline catch-up assertion).
#
# COLCA_IMAGE selects the image for every container (default colca:dev, the tag
# `make docker` builds).
#
# Per-LINK networks — one Docker network per tree edge, nothing shared wider:
#
#   link3-hub    global ↔ site1
#   link2-edges  site1  ↔ edge1, edge2
#   link1-m1     edge1  ↔ m1
#   link1-m2     edge2  ↔ m2
#
# This is what lets a test partition a SINGLE link (`docker network disconnect`
# of the child's endpoint from its uplink network) while every other link —
# including the machine feeding the partitioned edge — keeps flowing.
#
# Host ports — every published port is templated as ${COLCA_PORT_*:-<base>}:
# unset (plain `docker compose up`, demo.sh, smoke.sh) gives the fixed base
# ports. A harness that runs several worlds at once sets every variable from
# one offset (base+N each) and uses a matching compose project name, so the
# worlds are disjoint in ports and in containers, networks and volumes. Compose
# has no arithmetic in ${...} interpolation, so per-port variables are the
# mechanism; the defaults keep this file standalone.
#
# Load-bearing detail — host observability under partition: Docker binds a
# container's published-port forwarding to ONE endpoint (measured on Docker
# Desktop 29: the network attached at container create — compose picks it by
# `priority`, then name; `gw_priority` does NOT move the forwarding). So a
# node that can be partitioned must never lose that endpoint: each one gets
# a dedicated single-member OBSERVATION network (`host-<node>`) that wins
# the primary pick under both rules — `priority: 100` and sorting before
# every `link*` name — and that a partition test never disconnects. The host
# can therefore always observe a partitioned node over HTTP/MQTT. Single-member
# networks carry no node↔node connectivity, so they cannot leak around a
# severed link.
services:
  colca-volume-init:
    image: ${COLCA_IMAGE:-colca:dev}
    user: "0:0"
    entrypoint: ["/usr/local/bin/colca-volume-init"]
    command:
      - /volumes/global-data
      - /volumes/global-secrets
      - /volumes/site1-data
      - /volumes/site1-secrets
      - /volumes/edge1-data
      - /volumes/edge1-secrets
      - /volumes/edge2-data
      - /volumes/edge2-secrets
      - /volumes/keys
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    environment:
      COLCA_VOLUME_UID: "65532"
      COLCA_VOLUME_GID: "65532"
      COLCA_COPY_TREE_SOURCE: /inputs/keys
      COLCA_COPY_TREE_TARGET: /volumes/keys
    volumes:
      - "./keys:/inputs/keys:ro"
      - "world-keys:/volumes/keys"
      - "global-data:/volumes/global-data"
      - "global-secrets:/volumes/global-secrets"
      - "site1-data:/volumes/site1-data"
      - "site1-secrets:/volumes/site1-secrets"
      - "edge1-data:/volumes/edge1-data"
      - "edge1-secrets:/volumes/edge1-secrets"
      - "edge2-data:/volumes/edge2-data"
      - "edge2-secrets:/volumes/edge2-secrets"

  global:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/global.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/global.yaml:/etc/colca/global.yaml:ro"
      - "world-keys:/keys:ro"
      - "global-data:/data"
      - "global-secrets:/secrets"
    # 11880 is the hub bus: every record replicated up from the whole tree is
    # mirrored there under its stored topic (subscribe with an enrolled read:# identity).
    # 11890/11891 are the HUMAN doors (JWT over TLS: raw MQTT / WebSocket) —
    # usable only when the human-auth profile (keycloak) is up; without it the
    # hub keeps retrying its JWKS fetch and the doors reject every token.
    # 19443 is the replication door, published ONLY on global: a chaski.Node
    # embedded in a process on the host is not on this compose network, so it
    # dials its parent by host port like everything else it reaches — the same
    # reason 18080 exists beside link3-hub's in-network :443. site1/edge1/edge2
    # keep theirs unpublished; only a child enrolled at the root needs this from
    # outside Docker.
    ports:
      - "127.0.0.1:${COLCA_PORT_GLOBAL_API:-18080}:443"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_MQTT:-11880}:8883"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_HUMAN_MQTT:-11890}:8884"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_HUMAN_WS:-11891}:8885"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_REPL:-19443}:9443"
    networks:
      link3-hub:     # keep the primary pick: host ports bind here
        priority: 100
      kc-global: {}  # global ↔ keycloak only (JWKS fetch), pairwise by design
      gs-global: {}  # global ↔ grantsync only, pairwise for the same reason
    depends_on:
      colca-volume-init:
        condition: service_completed_successfully

  site1:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/site1.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/site1.yaml:/etc/colca/site1.yaml:ro"
      - "world-keys:/keys:ro"
      - "site1-data:/data"
      - "site1-secrets:/secrets"
    ports:
      - "127.0.0.1:${COLCA_PORT_SITE1_API:-18081}:443"
      - "127.0.0.1:${COLCA_PORT_SITE1_MQTT:-11881}:8883"
    depends_on: [global]
    networks:
      host-site1:    # observation net = primary: host ports survive partitions
        priority: 100
      link2-edges: {}
      link3-hub: {}

  edge1:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/edge1.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/edge1.yaml:/etc/colca/edge1.yaml:ro"
      - "world-keys:/keys:ro"
      - "edge1-data:/data"
      - "edge1-secrets:/secrets"
    ports:
      - "127.0.0.1:${COLCA_PORT_EDGE1_API:-18082}:443"
      - "127.0.0.1:${COLCA_PORT_EDGE1_MQTT:-11883}:8883"
      - "127.0.0.1:${COLCA_PORT_EDGE1_HUMAN_MQTT:-11892}:8884"
    depends_on: [site1]
    networks:
      host-edge1:    # observation net = primary: host ports survive partitions
        priority: 100
      kc-edge1: {}   # edge1 ↔ keycloak only (JWKS fetch), pairwise by design
      link1-m1: {}
      link2-edges: {}

  edge2:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/edge2.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/edge2.yaml:/etc/colca/edge2.yaml:ro"
      - "world-keys:/keys:ro"
      - "edge2-data:/data"
      - "edge2-secrets:/secrets"
    ports:
      - "127.0.0.1:${COLCA_PORT_EDGE2_API:-18083}:443"
      - "127.0.0.1:${COLCA_PORT_EDGE2_MQTT:-11884}:8883"
    depends_on: [site1]
    networks:
      host-edge2:    # observation net = primary: host ports survive partitions
        priority: 100
      link1-m2: {}
      link2-edges: {}

  m1:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-machine"]
    restart: unless-stopped
    environment:
      MACHINE_ULID: m1
      MACHINE_KEY: /keys/m1-machine.key
      BROKER_ADDR: "edge1:8883"
      NODE_ULID: n-edge1
      PUBLISH_INTERVAL_MS: "1000"
      # Simulated clock skew for this machine only (SIM_CLOCK_OFFSET_MS in
      # cmd/colca-machine): a test recreates m1 with SIM_CLOCK_OFFSET_MS_M1 set
      # to skew its notion of wall time. Unset or 0 means no skew.
      SIM_CLOCK_OFFSET_MS: "${SIM_CLOCK_OFFSET_MS_M1:-0}"
    volumes:
      - "world-keys:/keys:ro"
    depends_on: [edge1]
    networks: [link1-m1]

  m2:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-machine"]
    restart: unless-stopped
    environment:
      MACHINE_ULID: m2
      MACHINE_KEY: /keys/m2-machine.key
      BROKER_ADDR: "edge2:8883"
      NODE_ULID: n-edge2
      PUBLISH_INTERVAL_MS: "1000"
      # See m1's SIM_CLOCK_OFFSET_MS comment above.
      SIM_CLOCK_OFFSET_MS: "${SIM_CLOCK_OFFSET_MS_M2:-0}"
    volumes:
      - "world-keys:/keys:ro"
    depends_on: [edge2]
    networks: [link1-m2]

  # Keycloak for people signing in (opt-in):
  #   docker compose --profile human-auth up -d
  # The upstream image in dev mode, importing the minimal colca realm.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    profiles: ["human-auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-demo-password
      # Pin the issuer: tokens minted through the host port (127.0.0.1:18095)
      # must carry the SAME iss the nodes validate against (the in-network
      # name), or every token dies on the issuer check.
      KC_HOSTNAME: http://keycloak:8080
    volumes:
      - "./config/colca-realm.json:/opt/keycloak/data/import/colca-realm.json:ro"
    ports:
      - "127.0.0.1:${COLCA_PORT_KEYCLOAK:-18095}:8080"
    # Pairwise kc-* networks: each auth-bearing node (an `auth:` block in its
    # config template — global and edge1) reaches keycloak for its JWKS fetch
    # over its OWN two-member network. No kc-* network ever carries node↔node
    # traffic, so nothing leaks around a severed link, and token verification
    # keeps working during a partition.
    networks: [kc-edge1, kc-global, gs-keycloak]

  # The grant-sync service: Keycloak's grants become _Group definitions in the
  # tree, and the tree's elements become authz resources somebody can grant on.
  # A SIBLING of colcad from the same image, never part of it — Keycloak stays
  # out of the node core and out of the message path.
  #
  # It talks to the ROOT node only. Definitions descend on their own, so there is
  # nothing to run per node, and an edge that is offline picks them up when it
  # reconnects.
  #
  # Its OWN profile, not human-auth, and the reason is worth stating: this
  # service CONVERGES. Any _Group definition authored at the root that Keycloak
  # does not account for is one it retracts — which is correct in production and
  # ruinous in a test world where group definitions are authored by hand.
  # So it starts only when asked for by name:
  #   docker compose --profile human-auth --profile grant-sync up -d
  grantsync:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-grantsync"]
    profiles: ["grant-sync"]
    restart: unless-stopped
    environment:
      COLCA_URL: http://global
      COLCA_SERVICE: grantsync
      KC_URL: http://keycloak:8080
      KC_REALM: colca
      KC_CLIENT_SECRET: colca-authz-dev-secret
      OWNER: colca-demo
      SYNC_INTERVAL_MS: "${GRANTSYNC_INTERVAL_MS:-5000}"
    ports:
      - "127.0.0.1:${COLCA_PORT_GRANTSYNC:-19090}:9090"
    depends_on: [global, keycloak]
    # Its own pairwise networks, keeping the kc-* invariant intact: no network
    # this service joins ever carries node↔node traffic either.
    networks: [gs-global, gs-keycloak]

volumes:
  world-keys: {}
  global-data: {}
  global-secrets: {}
  site1-data: {}
  site1-secrets: {}
  edge1-data: {}
  edge1-secrets: {}
  edge2-data: {}
  edge2-secrets: {}

networks:
  host-edge1: {}
  host-edge2: {}
  host-site1: {}
  gs-global: {}
  gs-keycloak: {}
  kc-edge1: {}
  kc-global: {}
  link1-m1: {}
  link1-m2: {}
  link2-edges: {}
  link3-hub: {}
