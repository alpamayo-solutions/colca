# colca/deploy/docker-compose.yml — the 4-node / 3-level demo topology.
#
#   global (level 1)            mounts: site1 → n-site1
#      ▲ mTLS
#   site1  (level 2)            mounts: edge1 → n-edge1, edge2 → n-edge2
#      ▲          ▲ mTLS
#   edge1        edge2          machines m1/m2 enrolled at their edges (smoke.sh)
#      ▲ MQTT       ▲ MQTT
#     m1           m2
#
# Startup is deterministic without healthchecks (distroless has no shell, so a
# CMD-based healthcheck is impossible): depends_on gives the parent-before-child
# order, and `restart: unless-stopped` heals a node that loses the race anyway —
# while still honouring an explicit `docker compose stop <svc>` (which the smoke
# test uses for the offline catch-up assertion).
#
# COLCA_IMAGE selects the image for every container (default colca:dev, the tag
# `make docker` builds): the level-4 system suite (tests/system) drives this
# same file against whatever image dev.py resolved (bake tag or CI run tag).
#
# Per-LINK networks — one Docker network per tree edge, nothing shared wider:
#
#   link3-hub    global ↔ site1
#   link2-edges  site1  ↔ edge1, edge2
#   link1-m1     edge1  ↔ m1
#   link1-m2     edge2  ↔ m2
#
# This is what lets the chaos suite partition a SINGLE link (`docker network
# disconnect` of the child's endpoint from its uplink network) while every
# other link — including the machine feeding the partitioned edge — keeps
# flowing.
#
# Host ports — every published port is templated as ${COLCA_PORT_*:-<base>}:
# unset (plain `docker compose up`, demo.sh, smoke.sh) gives today's fixed
# base ports; the system-suite harness (tests/system/system_world.py, via
# `dev.py test system --port-offset N`) computes the full variable set from
# ONE offset (base+N each) and derives the compose project name from the same
# offset (`deploy` at 0, `deploy-oN` otherwise), so concurrent worlds are
# disjoint in ports AND containers/networks/volumes by construction. Compose
# has no arithmetic in ${...} interpolation, so per-port variables computed
# by the harness are the mechanism; the defaults keep this file standalone.
# COLCA_PORT_OFFSET/COLCA_PORT_* are the same repo-wide port-offset
# convention node-manager uses (`colca generate --port-offset`) — see the
# authoritative offset table in the "Port Offset Rules" section.
# Per-purpose offset conventions are documented in
# docs/source/development/testing.rst (0 dev/demo/smoke, 400 chaos in CI,
# 500 system in CI).
#
# Load-bearing detail — host observability under partition: Docker binds a
# container's published-port forwarding to ONE endpoint (measured on Docker
# Desktop 29: the network attached at container create — compose picks it by
# `priority`, then name; `gw_priority` does NOT move the forwarding). So a
# node that can be partitioned must never lose that endpoint: each one gets
# a dedicated single-member OBSERVATION network (`host-<node>`) that wins
# the primary pick under both rules — `priority: 100` and sorting before
# every `link*` name — and that no chaos primitive ever disconnects. The
# host can therefore always observe a partitioned node over HTTP/MQTT; the
# chaos self-tests assert reachability DURING a partition and go red if a
# Docker version changes the selection rule. Single-member networks carry no
# node↔node connectivity, so they cannot leak around a severed link.
services:
  global:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/global.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/global.yaml:/etc/colca/global.yaml:ro"
      - "./keys:/keys:ro"
      - "global-data:/data"
    # 11880 is the hub bus: every record replicated up from the whole tree is
    # mirrored there under its stored topic (subscribe with an enrolled read:# identity).
    ports:
      - "127.0.0.1:${COLCA_PORT_GLOBAL_API:-18080}:8080"
      - "127.0.0.1:${COLCA_PORT_GLOBAL_MQTT:-11880}:1883"
    networks: [link3-hub]

  site1:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/site1.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/site1.yaml:/etc/colca/site1.yaml:ro"
      - "./keys:/keys:ro"
      - "site1-data:/data"
    ports:
      - "127.0.0.1:${COLCA_PORT_SITE1_API:-18081}:8080"
      - "127.0.0.1:${COLCA_PORT_SITE1_MQTT:-11881}:1883"
    depends_on: [global]
    networks:
      host-site1:    # observation net = primary: host ports survive partitions
        priority: 100
      link2-edges: {}
      link3-hub: {}

  edge1:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/edge1.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/edge1.yaml:/etc/colca/edge1.yaml:ro"
      - "./keys:/keys:ro"
      - "edge1-data:/data"
    ports:
      - "127.0.0.1:${COLCA_PORT_EDGE1_API:-18082}:8080"
      - "127.0.0.1:${COLCA_PORT_EDGE1_MQTT:-11883}:1883"
    depends_on: [site1]
    networks:
      host-edge1:    # observation net = primary: host ports survive partitions
        priority: 100
      link1-m1: {}
      link2-edges: {}

  edge2:
    image: ${COLCA_IMAGE:-colca:dev}
    command: ["/etc/colca/edge2.yaml"]
    restart: unless-stopped
    volumes:
      - "./config/edge2.yaml:/etc/colca/edge2.yaml:ro"
      - "./keys:/keys:ro"
      - "edge2-data:/data"
    ports:
      - "127.0.0.1:${COLCA_PORT_EDGE2_API:-18083}:8080"
      - "127.0.0.1:${COLCA_PORT_EDGE2_MQTT:-11884}:1883"
    depends_on: [site1]
    networks:
      host-edge2:    # observation net = primary: host ports survive partitions
        priority: 100
      link1-m2: {}
      link2-edges: {}

  m1:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-machine"]
    restart: unless-stopped
    environment:
      MACHINE_ULID: m1
      MACHINE_KEY: /keys/m1-machine.key
      BROKER_ADDR: "edge1:1883"
      PUBLISH_INTERVAL_MS: "1000"
    volumes:
      - "./keys:/keys:ro"
    depends_on: [edge1]
    networks: [link1-m1]

  m2:
    image: ${COLCA_IMAGE:-colca:dev}
    entrypoint: ["/usr/local/bin/colca-machine"]
    restart: unless-stopped
    environment:
      MACHINE_ULID: m2
      MACHINE_KEY: /keys/m2-machine.key
      BROKER_ADDR: "edge2:1883"
      PUBLISH_INTERVAL_MS: "1000"
    volumes:
      - "./keys:/keys:ro"
    depends_on: [edge2]
    networks: [link1-m2]

volumes:
  global-data: {}
  site1-data: {}
  edge1-data: {}
  edge2-data: {}

networks:
  host-edge1: {}
  host-edge2: {}
  host-site1: {}
  link1-m1: {}
  link1-m2: {}
  link2-edges: {}
  link3-hub: {}
