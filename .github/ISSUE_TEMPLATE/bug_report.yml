name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal configuration, command or test. Leave out keys and tokens.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `colcad --version`, the image tag, or the commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
