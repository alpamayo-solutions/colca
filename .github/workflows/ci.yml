name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # release-please starts this on the tag it creates; such a tag starts nothing by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt, go vet, working notes
        run: make check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.13.2
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  python-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: ruff, bandit, mypy
        run: make lint-python

  repo-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: hadolint
        run: make lint-docker
      - name: shellcheck
        run: make lint-shell
      - name: actionlint
        run: make lint-actions
      - name: yamllint
        run: make lint-yaml
      - name: gitleaks
        run: make lint-secrets
      - name: No working notes in the commits of this pull request
        if: github.event_name == 'pull_request'
        run: scripts/check-no-working-notes.sh "origin/${{ github.base_ref }}"

  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: Schema bundle
        run: make bundle
      - name: Tests
        run: make test

  contracts-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: Contract tests
        run: uv run --project contracts --python ${{ matrix.python-version }} --extra test pytest contracts/tests

  # The Node jobs carry no `needs`, so they run beside the long Go and container
  # tests instead of after them. Publishing still waits for them: they are in the
  # `needs` of image and packages below.
  ts-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: eslint, prettier and tsc
        run: make lint-ts
      # Regenerated from this commit's bundle and diffed, so the committed types
      # cannot fall behind the contracts.
      - name: The generated contract types are current
        run: make ts-types
      - name: The package as npm would publish it
        run: make ts-build

  ts-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - name: Tests, conformance vectors included
        run: make ts-test

  smoke:
    needs: [go-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: Four-node tree in containers
        run: make smoke

  # Everything below runs for pushes to main and for version tags, once every
  # check above has passed.

  version:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      python: ${{ steps.version.outputs.python }}
    steps:
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            semver="${GITHUB_REF_NAME#v}"
            if [[ ! "$semver" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([0-9]+))?$ ]]; then
              echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-rc.N"
              exit 1
            fi
            python="${BASH_REMATCH[1]}${BASH_REMATCH[3]:+rc${BASH_REMATCH[3]}}"
          else
            semver="0.0.0-dev.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}"
            python="0.0.0.dev${GITHUB_RUN_NUMBER}+g${GITHUB_SHA::7}"
          fi
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"

  image:
    needs: [version, go-lint, python-lint, repo-lint, ts-lint, ts-test, go-test, contracts-test, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: Schema bundle
        run: make bundle
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=colca
            org.opencontainers.image.description=An MQTT broker for plants organised as a tree
            org.opencontainers.image.licenses=FSL-1.1-ALv2
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          build-contexts: contracts-bundle=build/bundle
          build-args: VERSION=${{ needs.version.outputs.semver }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: github.event.repository.visibility == 'public'
        with:
          cosign-release: v3.1.3
      # Keyless: the certificate names this workflow and ref, and the signature is
      # recorded in the public transparency log. --recursive signs each platform too.
      - name: Sign the image
        if: github.event.repository.visibility == 'public'
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE"
      - name: Verify the signature
        if: github.event.repository.visibility == 'public'
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify "$IMAGE" --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: v1.51.1
      - name: SBOMs of the image
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p sbom
          for platform in linux/amd64 linux/arm64; do
            name="colca-image-${platform//\//-}"
            "$SYFT" scan "registry:$IMAGE" --platform "$platform" \
              -o "spdx-json=sbom/$name.spdx.json" -o "cyclonedx-json=sbom/$name.cdx.json"
          done
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/colca-image-linux-amd64.spdx.json
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        if: github.event.repository.visibility == 'public'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom/colca-image-linux-arm64.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-image
          path: sbom/
          if-no-files-found: error

  packages:
    needs: [version, go-lint, python-lint, repo-lint, ts-lint, ts-test, go-test, contracts-test, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.17"
      - name: colca-data-contracts wheel and sdist
        run: |
          uv version --project contracts --frozen "$VERSION"
          uv build contracts --out-dir dist
      - name: colcad wheels
        run: |
          make wheels VERSION="$VERSION"
          cp build/wheels/*.whl dist/
      - name: Check package metadata
        run: uvx twine@7.0.0 check --strict dist/*
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: v1.51.1
      # The runtime dependencies of the contracts package; the image SBOMs cover colcad.
      - name: SBOM of colca-data-contracts
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p sbom
          uv export --project contracts --frozen --no-dev --format cyclonedx1.5 -o sbom/colca-data-contracts.cdx.json
          python3 - "$VERSION" <<'EOF'
          import json, sys
          path = "sbom/colca-data-contracts.cdx.json"
          bom = json.load(open(path))
          bom["metadata"]["component"]["version"] = sys.argv[1]
          json.dump(bom, open(path, "w"), indent=2)
          EOF
          "$SYFT" convert sbom/colca-data-contracts.cdx.json -o spdx-json=sbom/colca-data-contracts.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        with:
          subject-path: dist/colca_data_contracts-*.whl
          sbom-path: sbom/colca-data-contracts.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-packages
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-contracts
          path: sbom/
          if-no-files-found: error

  # The npm package, built the same way as the Python one: version from the tag,
  # SBOM, attestations, and an artifact the publish job takes as it is.
  npm-package:
    needs: [version, go-lint, python-lint, repo-lint, ts-lint, ts-test, go-test, contracts-test, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.semver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - name: Dependencies
        run: cd clients/ts && npm ci
      # Build metadata (+sha) is dropped: npm has no use for it, and a dev build
      # is packed for the artifact only, never published.
      - name: Version
        run: cd clients/ts && npm version --no-git-tag-version --allow-same-version "${VERSION%%+*}"
      - name: Build and check
        run: cd clients/ts && npm run build && npm run package-check
      - name: Tarball
        run: |
          mkdir -p dist
          cd clients/ts && npm pack --pack-destination ../../dist
      - id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: v1.51.1
      # The client has no runtime dependencies, so this SBOM is mostly the
      # package itself — which is the point: it says so in a form a consumer can check.
      - name: SBOM of colca-client
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p sbom
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON \
            --output-file sbom/colca-client.cdx.json clients/ts/package.json
          "$SYFT" convert sbom/colca-client.cdx.json -o spdx-json=sbom/colca-client.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*.tgz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*.tgz
          sbom-path: sbom/colca-client.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-package
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-client
          path: sbom/
          if-no-files-found: error

  # Trusted publishing again: npm accepts uploads from this workflow in the npm
  # environment, so no token is stored anywhere. The OIDC exchange needs npm
  # 11.5.1 or newer, hence the explicit install.
  npm:
    needs: [npm-package]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-package
          path: dist
      - run: npm install -g npm@12.0.2
      # ./ matters: npm reads dist/name.tgz as the GitHub shorthand owner/repo.
      - run: npm publish ./dist/*.tgz --provenance --access public

  # Trusted publishing: PyPI accepts uploads from this workflow in the pypi
  # environment, so no token is stored anywhere.
  pypi:
    needs: [packages]
    if: startsWith(github.ref, 'refs/tags/v') && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  release:
    needs: [version, image, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-packages
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: sbom-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ needs.version.outputs.semver }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS)
          {
            echo "Container image: \`$IMAGE\` (linux/amd64, linux/arm64)."
            echo "It is signed with cosign; SECURITY.md shows how to verify it."
            echo
            echo "Attached: \`colca-data-contracts\` as wheel and sdist, and \`colcad\` wheels for \`chaski[node]\`."
            echo "Both are also on PyPI: \`pip install colca-data-contracts\`, \`pip install colcad\`."
            echo "SBOMs in SPDX and CycloneDX: the image per platform, and \`colca-data-contracts\`."
          } > assets.md
          # release-please normally created the release with its changelog; a tag pushed
          # by hand gets a new release with generated notes.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
            if ! grep -q "Container image:" <<< "$body"; then
              printf '%s\n\n%s\n' "$body" "$(cat assets.md)" > notes.md
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Colca $GITHUB_REF_NAME" \
              --notes-file assets.md --generate-notes "${prerelease[@]}"
          fi
