[project]
name = "colcad"
# Stamped by scripts/build_colcad_wheels.py at build time. The 0.0.0
# placeholder is never published.
version = "0.0.0"
description = "The colcad binary, packaged for chaski.Node (chaski[node])"
readme = "README.md"
license = { text = "FSL-1.1-ALv2" }
requires-python = ">=3.9"

[build-system]
# wheel>=0.42 is pinned for its executable-permission-preserving package_data
# handling — this wheel's entire payload is one +x binary, so a regression
# here would silently ship a colcad nothing can execute.
requires = ["setuptools>=77", "wheel>=0.42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["colcad"]
include-package-data = true

[tool.setuptools.package-data]
# Whichever binary name the build actually staged (colcad on every platform
# this package ships for today — see build_colcad_wheels.py's TARGETS).
colcad = ["bin/*", "contracts-bundle.json"]
